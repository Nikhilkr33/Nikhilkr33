name: Generate Futuristic Contribution Snake

on:
  # Automatically update every 12 hours
  schedule:
    - cron: "0 */12 * * *"

  # Allow manual execution from GitHub Actions
  workflow_dispatch:

  # Regenerate whenever the main branch changes
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:

      # ==========================================
      # 1. Checkout Repository
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Create Output Directory
      # ==========================================
      - name: Create Output Directory
        run: mkdir -p dist

      # ==========================================
      # 3. Generate 2D Cyberpunk Contribution Snake
      # ==========================================
      - name: Generate 2D Cyberpunk Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Nikhilkr33
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00f3ff&color_dots=#12131a,#050515,#005277,#00a8e8,#00f3ff

      # ==========================================
      # 4. Generate 3D Futuristic Contribution Graph
      # ==========================================
      - name: Generate 3D Futuristic Contribution Graph
        uses: yoshi38610/github-contribution-grid-snake-3d@v1.0.0
        with:
          github_user_name: Nikhilkr33
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # 5. Move 3D Assets to dist
      # ==========================================
      - name: Prepare 3D Assets
        run: |
          if [ -d "github-contribution-grid-snake-3d" ]; then
            cp -R github-contribution-grid-snake-3d/* dist/ || true
          fi

          echo "Generated files:"
          find dist -type f -maxdepth 2

      # ==========================================
      # 6. Deploy to Output Branch
      # ==========================================
      - name: Deploy Snake to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
